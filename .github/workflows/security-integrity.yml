name: security-integrity

on:
  pull_request:
  push:
    branches:
      - main
      - work
  workflow_dispatch:

jobs:
  scan-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JSON shape
        run: |
          node -e "JSON.parse(require('fs').readFileSync('worker_files/worker.config.json','utf8')); JSON.parse(require('fs').readFileSync('worker_files/worker.config.schema.json','utf8'));"

      - name: Run security + integrity scan
        run: node scripts/security-integrity-check.mjs

  cf-worker-handshake:
    runs-on: ubuntu-latest
    needs: scan-and-validate
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify handshake + Turnstile secrets/variables presence
        env:
          DRASTIC_MEASURES: ${{ secrets.DRASTIC_MEASURES }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_tastycles: ${{ vars.TURNSTILE_tastycles }}
        run: |
          if [ -z "$DRASTIC_MEASURES" ]; then
            echo "Missing DRASTIC_MEASURES secret in repository settings."
            exit 1
          fi
          if [ -z "$TURNSTILE_SECRET_KEY" ]; then
            echo "Missing TURNSTILE_SECRET_KEY secret in repository settings."
            exit 1
          fi
          if [ -z "$TURNSTILE_tastycles" ]; then
            echo "Missing TURNSTILE_tastycles variable in repository settings."
            exit 1
          fi
          if [ "$TURNSTILE_tastycles" != "0x4AAAAAACf9q_m7LLI2VXXj" ]; then
            echo "TURNSTILE_tastycles variable does not match expected public site key."
            exit 1
          fi

      - name: Perform repo secret handshake with Cloudflare Worker
        env:
          DRASTIC_MEASURES: ${{ secrets.DRASTIC_MEASURES }}
        run: node scripts/cf-worker-handshake.mjs
