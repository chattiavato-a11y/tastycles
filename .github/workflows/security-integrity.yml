name: security-integrity

on:
  pull_request:
  push:
    branches:
      - main
      - work
  workflow_dispatch:

jobs:
  scan-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JSON shape
        run: |
          node -e "JSON.parse(require('fs').readFileSync('worker_files/worker.config.json','utf8')); JSON.parse(require('fs').readFileSync('worker_files/worker.config.schema.json','utf8'));"

      - name: Run security + integrity scan
        run: node scripts/security-integrity-check.mjs

  cf-worker-handshake:
    runs-on: ubuntu-latest
    needs: scan-and-validate
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Repo ↔ Worker handshake
        uses: actions/github-script@v7
        env:
          WORKER_URL: https://drastic-measures.rulathemtodos.workers.dev/__repo/handshake
          DRASTIC_MEASURES: ${{ secrets.DRASTIC_MEASURES }}
        with:
          script: |
            const url = process.env.WORKER_URL;
            const secret = process.env.DRASTIC_MEASURES;
            if (!secret) throw new Error("Missing secrets.DRASTIC_MEASURES");

            const res = await fetch(url, {
              method: "POST",
              headers: {
                "x-gabo-repo-id": secret,
                "content-type": "application/json",
                "accept": "application/json",
              },
              body: JSON.stringify({ ok: true, from: "github-actions" }),
            });

            const text = await res.text();
            if (!res.ok) throw new Error(`Handshake failed: ${res.status} ${text}`);
            console.log("Handshake OK:", text);
