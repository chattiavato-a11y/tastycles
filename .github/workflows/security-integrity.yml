name: security-integrity

on:
  pull_request:
  push:
    branches:
      - main
      - work
  workflow_dispatch:

jobs:
  scan-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JSON shape
        run: |
          node -e "JSON.parse(require('fs').readFileSync('worker_files/worker.config.json','utf8')); JSON.parse(require('fs').readFileSync('worker_files/worker.config.schema.json','utf8'));"

      - name: Run security + integrity scan
        run: node scripts/security-integrity-check.mjs

  cf-worker-handshake:
    runs-on: ubuntu-latest
    needs: scan-and-validate
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read handshake readiness from worker config
        id: handshake_ready
        run: |
          READY=$(node -e "const fs=require('fs');const cfg=JSON.parse(fs.readFileSync('worker_files/worker.config.json','utf8'));process.stdout.write(String(Boolean(cfg?.actions_handshake?.ready)));")
          echo "ready=${READY}" >> "$GITHUB_OUTPUT"

      - name: Skip handshake (not enabled)
        if: steps.handshake_ready.outputs.ready != 'true'
        run: echo "Repo ↔ Worker handshake disabled by worker_files/worker.config.json (actions_handshake.ready=false)."

      - name: Repo ↔ Worker handshake
        if: steps.handshake_ready.outputs.ready == 'true'
        env:
          DRASTIC_MEASURES: ${{ secrets.DRASTIC_MEASURES }}
        run: node scripts/cf-worker-communication.mjs --action handshake
