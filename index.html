<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gabo | Secure Multilingual AI Concierge Chat</title>
  <meta
    name="description"
    content="Gabo delivers secure, multilingual concierge chat experiences with compliance-first design, fast performance, and AI-ready guidance."
  />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="theme-color" content="#10a37f" />
  <meta name="author" content="Gabo" />
  <link rel="canonical" href="https://www.gabos.io/" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Gabo | Secure Multilingual AI Concierge Chat" />
  <meta
    property="og:description"
    content="Secure, human-centered multilingual concierge chat with fast UX and compliance-first architecture."
  />
  <meta property="og:url" content="https://www.gabos.io/" />
  <meta property="og:site_name" content="Gabo" />
  <meta property="og:locale" content="en_US" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Gabo | Secure Multilingual AI Concierge Chat" />
  <meta
    name="twitter:description"
    content="Chat in any language with a secure, compliance-aware AI concierge built for speed and reliability."
  />

  <link rel="preload" href="css/main.css" as="style" />
  <link rel="preload" href="css/adapt_screens.css" as="style" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/adapt_screens.css" />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Gabo",
      "url": "https://www.gabos.io/",
      "description": "Secure multilingual concierge chat experiences with compliance-first architecture.",
      "inLanguage": "en",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.gabos.io/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
  </script>

  <script defer src="worker_files/client.worker.js"></script>
  <script defer src="app.js"></script>
</head>

<body>
  <main class="chat-app" aria-label="Gabo chat interface">
    <header class="chat-header">
      <div class="brand">
        <div class="brand-title">
          <h1>Gabo</h1>
        </div>
      </div>
      <div class="header-actions" aria-live="polite">
        <div class="status-stack">
          <span id="thinking-status" class="status-line">Standing by.</span>
        </div>
      </div>
    </header>

    <section class="chat-body" id="chat-log" aria-live="polite">
      <div class="intro-copy intro-panel" aria-label="Chat introduction">
        <span class="intro-kicker" data-i18n="welcome">Welcome</span>
        <h2 data-i18n="startConversation">Start a conversation</h2>
        <p>
          <span data-i18n="introCopy">
            Chat in any language — spoken or written. Gabo auto-detects your language and replies in kind.
          </span>
        </p>
      </div>
    </section>

    <footer class="chat-footer">
      <form id="chat-form" class="input-shell" autocomplete="off">
        <!-- Honeypot 1 -->
        <label class="honeypot-field" for="contact-field" aria-hidden="true">Leave this field empty</label>
        <input
          id="contact-field"
          class="honeypot-field"
          type="text"
          name="contact"
          tabindex="-1"
          autocomplete="off"
          aria-hidden="true"
        />

        <input
          id="msgInput"
          type="text"
          placeholder="Message in any language..."
          maxlength="256"
          aria-label="Type your message"
          required
        />

        <!-- Honeypot 2 -->
        <label class="honeypot-field" for="website-field" aria-hidden="true">Leave this field empty</label>
        <input
          id="website-field"
          class="honeypot-field"
          type="text"
          name="website"
          tabindex="-1"
          autocomplete="off"
          aria-hidden="true"
        />

        <span id="voice-helper" class="voice-helper" aria-live="polite"></span>

        <button id="micBtn" type="button" aria-label="Voice reply" aria-pressed="false" title="Voice reply">
          <svg class="voice-icon" viewBox="0 0 24 24" role="img" aria-hidden="true" focusable="false">
            <path d="M12 16.75A4.75 4.75 0 0 1 7.25 12V6a4.75 4.75 0 1 1 9.5 0v6A4.75 4.75 0 0 1 12 16.75zm6.25-4.75a.75.75 0 0 1 1.5 0A7.75 7.75 0 0 1 12.75 19.7v2.05a.75.75 0 0 1-1.5 0V19.7A7.75 7.75 0 0 1 4.25 12a.75.75 0 0 1 1.5 0 6.25 6.25 0 0 0 12.5 0z" />
          </svg>
        </button>

        <button class="send-btn" type="submit" id="send-btn" disabled>Send</button>
        <button class="cancel-btn" type="button" id="cancel-btn" hidden>Cancel</button>
      </form>
    </footer>
  </main>
</body>
</html>
