<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gabo</title>
  <meta
    name="description"
    content="Gabo delivers secure, human-centered concierge chat experiences with compliance-first design, fast performance, and AI-ready guidance."
  />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#10a37f" />
  <link rel="canonical" href="https://www.gabos.io/" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/adapt_screens.css" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script defer src="worker_files/client.worker.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="chat-app" aria-label="Gabo chat interface">
    <header class="chat-header">
      <div class="brand">
        <div class="brand-title">
          <h1>Gabo</h1>
        </div>
      </div>
      <div class="header-actions" aria-live="polite">
        <div class="status-stack">
          <span id="thinking-status" class="status-line">Standing by.</span>
        </div>
      </div>
    </header>

    <section class="chat-body" id="chat-log" aria-live="polite">
      <div class="intro-copy intro-panel" aria-label="Chat introduction">
        <span class="intro-kicker" data-i18n="welcome">Welcome</span>
        <h2 data-i18n="startConversation">Start a conversation</h2>
        <p>
          <span data-i18n="introCopy">
            Chat in any language — spoken or written. Gabo auto-detects your language and replies in kind.
          </span>
        </p>
      </div>
    </section>

    <footer class="chat-footer">
      <form id="chat-form" class="input-shell" autocomplete="off">
        <label class="honeypot-field" for="contact-field" aria-hidden="true">Leave this field empty</label>
        <input
          id="contact-field"
          class="honeypot-field"
          type="text"
          name="contact"
          tabindex="-1"
          autocomplete="off"
          aria-hidden="true"
        />
        <input
          id="msgInput"
          type="text"
          placeholder="Message in any language..."
          maxlength="256"
          aria-label="Type your message"
          required
        />
        <label class="honeypot-field" for="website-field" aria-hidden="true">Leave this field empty</label>
        <input
          id="website-field"
          class="honeypot-field"
          type="text"
          name="website"
          tabindex="-1"
          autocomplete="off"
          aria-hidden="true"
        />
        <span id="voice-helper" class="voice-helper" aria-live="polite"></span>
        <button id="micBtn" type="button" aria-label="Voice reply" aria-pressed="false">
          <svg class="voice-wave-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <rect x="4" y="6" width="40" height="36" rx="10" fill="currentColor" />
            <g stroke="#ffffff" stroke-linecap="round" stroke-width="2.6">
              <line x1="16" y1="24" x2="16" y2="24" />
              <line x1="20" y1="19" x2="20" y2="29" />
              <line x1="24" y1="15" x2="24" y2="33" />
              <line x1="28" y1="19" x2="28" y2="29" />
              <line x1="32" y1="22" x2="32" y2="26" />
            </g>
          </svg>
        </button>
        <button class="send-btn" type="submit" id="send-btn" disabled>Send</button>
        <button class="cancel-btn" type="button" id="cancel-btn" hidden>Cancel</button>
      </form>
      <div class="turnstile-shell" aria-label="Bot protection challenge">
        <div
          class="cf-turnstile"
          id="turnstile-widget"
          data-sitekey="0x4AAAAAACf9q_m7LLI2VXXj"
          data-theme="auto"
          data-size="normal"
          data-retry="never"
        ></div>
      </div>
    </footer>
  </main>
</body>
</html>
